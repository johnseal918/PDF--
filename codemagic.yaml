workflows:
  cm_connectivity_check:
    name: CM Connectivity Check
    max_build_duration: 30
    instance_type: mac_mini_m2
    scripts:
      - name: Show repository root and key folders
        script: |
          set -e
          echo "Current directory:"
          pwd
          echo ""
          echo "Root entries:"
          ls -la
          echo ""
          echo "iOS folder entries (if exists):"
          ls -la iOS || true
          echo ""
          echo "Project folder entries (if exists):"
          ls -la iOS/app || true
      - name: Detect Xcode project/workspace
        script: |
          set -e
          echo "Searching for Xcode project files..."
          find . -type d \( -name "*.xcodeproj" -o -name "*.xcworkspace" \) | sed 's#^\./##' | sort || true
          PROJECT_COUNT=$(find . -type d \( -name "*.xcodeproj" -o -name "*.xcworkspace" \) | wc -l | tr -d ' ')
          echo "Detected project/workspace count: ${PROJECT_COUNT}"
          if [ "${PROJECT_COUNT}" = "0" ]; then
            echo "No .xcodeproj / .xcworkspace found yet."
            echo "Connectivity is verified. Next step is to add iOS project files or XcodeGen flow."
          fi

  ios_smoke_build:
    name: iOS Smoke Build (Manual)
    max_build_duration: 20
    instance_type: mac_mini_m2
    scripts:
      - name: Verify XcodeGen spec exists
        script: |
          set -e
          test -f iOS/app/project.yml
          echo "Found iOS/app/project.yml"
      - name: Generate Xcode project via XcodeGen
        script: |
          set -e
          cd iOS/app
          if command -v xcodegen >/dev/null 2>&1; then
            echo "Using preinstalled xcodegen"
          else
            echo "xcodegen not found, installing via Homebrew..."
            brew install xcodegen
          fi
          xcodegen --version
          xcodegen generate
          xcodebuild -list -project PDFSealMaster.xcodeproj
      - name: Build for iOS Simulator (unsigned)
        script: |
          set -e
          cd iOS/app

          echo "Build settings snapshot:"
          xcodebuild -showBuildSettings \
            -project "PDFSealMaster.xcodeproj" \
            -scheme "PDFSealMaster" \
            -sdk iphonesimulator \
            | grep -E "ARCHS|EXCLUDED_ARCHS|ONLY_ACTIVE_ARCH" \
            | sort -u || true

          set +e
          xcodebuild build \
            -project "PDFSealMaster.xcodeproj" \
            -scheme "PDFSealMaster" \
            -configuration Debug \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            ARCHS=arm64 \
            ONLY_ACTIVE_ARCH=YES \
            'EXCLUDED_ARCHS[sdk=iphonesimulator*]=x86_64' \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            > xcodebuild.log 2>&1

          BUILD_EXIT_CODE=$?
          set -e
          echo ""
          echo "===== Build tail (last 120 lines) ====="
          tail -n 120 xcodebuild.log || true
          echo "===== End build tail ====="

          if [ "${BUILD_EXIT_CODE}" -ne 0 ]; then
            echo ""
            echo "===== Extracted compiler errors ====="
            grep -n "error:" xcodebuild.log | tail -n 200 || true
            echo "===== End errors ====="
            exit "${BUILD_EXIT_CODE}"
          fi
      - name: Run unit tests on iOS Simulator
        script: |
          set -e
          cd iOS/app

          SIMULATOR_NAME=$(xcrun simctl list devices available \
            | awk -F '[()]' '/iPhone/ {gsub(/^[ \t]+|[ \t]+$/, "", $1); print $1; exit}')

          if [ -z "${SIMULATOR_NAME}" ]; then
            echo "No available iPhone simulator device found."
            exit 1
          fi

          echo "Using simulator: ${SIMULATOR_NAME}"

          set +e
          xcodebuild test \
            -project "PDFSealMaster.xcodeproj" \
            -scheme "PDFSealMaster" \
            -configuration Debug \
            -sdk iphonesimulator \
            -destination "platform=iOS Simulator,name=${SIMULATOR_NAME}" \
            ARCHS=arm64 \
            ONLY_ACTIVE_ARCH=YES \
            'EXCLUDED_ARCHS[sdk=iphonesimulator*]=x86_64' \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            > xcodebuild-test.log 2>&1

          TEST_EXIT_CODE=$?
          set -e

          echo ""
          echo "===== Test tail (last 120 lines) ====="
          tail -n 120 xcodebuild-test.log || true
          echo "===== End test tail ====="

          if [ "${TEST_EXIT_CODE}" -ne 0 ]; then
            echo ""
            echo "===== Extracted test errors ====="
            grep -n "error:" xcodebuild-test.log | tail -n 200 || true
            grep -n "failed" xcodebuild-test.log | tail -n 200 || true
            echo "===== End test errors ====="
            exit "${TEST_EXIT_CODE}"
          fi
